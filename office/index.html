<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI REVENUE CO. · 픽셀 오피스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f2c14e'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23a3283a'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23f6d58a'/%3E%3C/svg%3E">
<!-- Galmuri(갈무리) 픽셀 폰트: 선택 사항. 오프라인이면 아래 폰트 스택의 시스템 폰트/monospace 로 대체된다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" media="print" onload="this.media='all';window.dispatchEvent(new Event('galmuri'))">
<style>
:root{
  --bg:#1d1928; --bg2:#262034; --card:#2f2840; --card2:#3a3252; --line:#4d4469; --lineHi:#6e6296;
  --ink:#f4eddb; --mute:#a99fc6; --dim:#7d7399;
  --gold:#f2c14e; --green:#6cc070; --red:#e86a6a; --blue:#5aa9e6; --orange:#f09a4a;
  --purple:#a98be8; --teal:#4ec3b5; --pink:#f08cb0;
  --font:"Galmuri11","Galmuri9","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--font)}
body{min-height:100vh;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:8px 8px}
code,kbd{font-family:var(--font);background:#1a1625;border:1px solid var(--line);padding:0 5px;color:var(--gold);word-break:break-all}
b{font-weight:700}

/* ---- header ---- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1720px;margin:0 auto;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.08em}
.brand small{color:var(--mute);font-weight:400;letter-spacing:0;font-size:12px}
.logo{position:relative;width:24px;height:24px;background:var(--gold);box-shadow:inset -3px -3px 0 #b88a1d,inset 3px 3px 0 #ffe08a}
.logo::after{content:"AI";position:absolute;inset:0;display:grid;place-items:center;font-size:10px;color:#3a2a08}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 9px;border:2px solid;letter-spacing:.12em}
.badge.live{color:var(--green);border-color:var(--green);background:rgba(108,192,112,.1)}
.badge.live::before{content:"";width:7px;height:7px;background:var(--green);animation:blink 1.4s steps(2) infinite}
.badge.demo{color:#2b2233;background:var(--gold);border-color:#b88a1d;animation:blink 1.6s steps(2) infinite}
.badge.boot{color:var(--mute);border-color:var(--line)}
@keyframes blink{50%{opacity:.45}}
.meta{color:var(--mute);font-size:12px}
.tog{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:12px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--gold)}
.hint{max-width:1692px;margin:0 auto 10px;padding:7px 12px;border:2px dashed var(--gold);color:var(--gold);background:rgba(242,193,78,.08);font-size:12px}
.hint[hidden]{display:none}
@media (min-width:1720px){.hint{margin-left:auto;margin-right:auto}}

/* ---- layout ---- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:14px;max-width:1720px;margin:0 auto;padding:0 14px 28px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage-wrap{min-width:0}
.stage-frame{position:relative;padding:6px;background:#5a3c25;box-shadow:0 0 0 2px #2b1b10,inset 0 0 0 2px #7d5636,0 6px 0 0 rgba(0,0,0,.35)}
.stage-box{display:flex;justify-content:center;background:#2a1a10;line-height:0}
#stage{display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:manipulation;cursor:default;max-width:100%}
#stage.pointer{cursor:pointer}
.ribbon{position:absolute;right:16px;bottom:16px;z-index:3;pointer-events:none;font-size:11px;padding:2px 8px;letter-spacing:.14em;background:var(--gold);color:#2b2233;border:2px solid #b88a1d;animation:blink 1.6s steps(2) infinite}
.ribbon[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:12px;padding:8px 10px;background:var(--card);border:2px solid var(--line);font-size:12px}
.legend .sum{color:var(--mute);margin-right:4px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:9px;height:9px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.lg b{color:var(--c)}
.empty-note{color:var(--mute)}

/* ---- tooltip ---- */
.tip{position:absolute;z-index:6;min-width:170px;max-width:260px;max-height:300px;overflow:hidden;pointer-events:none;background:#17131f;border:2px solid var(--gold);padding:7px 9px;font-size:12px;line-height:1.45;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.tip[hidden]{display:none}
.tt-h{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.tt-h b{min-width:0;overflow-wrap:anywhere}
.dot{width:9px;height:9px;display:inline-block;background:var(--c,#999)}
.tt-role{font-size:11px;padding:0 6px;border:1px solid var(--c);color:var(--c)}
.tt-r{display:grid;grid-template-columns:34px 1fr;gap:6px}
.tt-r>span{color:var(--mute)}
.tt-r>i{font-style:normal;word-break:keep-all;overflow-wrap:anywhere}

/* ---- side panel ---- */
.panel{min-width:0}
@media (min-width:1101px){.panel{max-height:calc(100vh - 70px);overflow:auto;padding-right:4px;position:sticky;top:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}}
.card{position:relative;background:var(--card);margin:0 0 14px;padding:10px 12px 12px;box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 9px;font-size:13px;color:var(--gold);letter-spacing:.04em}
.card h2 small{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:0}
.card h2 .n{margin-left:auto;color:var(--mute);font-size:11px;font-weight:400}
.kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.kpi{min-width:0;background:var(--card2);padding:8px 10px;border-left:3px solid var(--c,var(--line))}
.kpi.wide{grid-column:1/-1}
.kpi .l{color:var(--mute);font-size:11px}
.kpi .v{font-size:19px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:12px;color:var(--mute);font-weight:400;margin-left:3px}
.kpi .s{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .v.sm{font-size:15px}
.kpi .v.xs{font-size:12px}
.kpi .v.neg{color:var(--red)}
.kpi .v.pos{color:var(--green)}
.seg{display:flex;height:8px;margin:6px 0 6px;background:#1a1625;gap:1px}
.seg i{display:block;background:var(--c);min-width:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font-size:11px;line-height:1.5;padding:0 6px;border:1px solid var(--c,var(--line));color:var(--c,var(--ink));background:rgba(0,0,0,.18);white-space:nowrap}
.chip.solid{background:var(--c);color:#241c33;border-color:var(--c)}
.list{list-style:none;margin:0;padding:0}
.scroll{max-height:330px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ev{display:grid;grid-template-columns:42px minmax(0,1fr);gap:2px 6px;align-items:baseline;padding:5px 2px;border-bottom:1px dashed rgba(255,255,255,.08);font-size:12px}
.ev .t{color:var(--dim);font-size:11px}
.ev .who{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
.ev .who b{min-width:0;overflow-wrap:anywhere}
.ev .msg{grid-column:2;color:var(--ink);overflow-wrap:anywhere}
.ev .ety{color:var(--c);font-size:11px}
.ev.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:rgba(242,193,78,.35)}100%{background:transparent}}
.ap{min-width:0;padding:7px 8px;margin-bottom:6px;background:var(--card2);border-left:3px solid var(--gold);font-size:12px;overflow-wrap:anywhere}
.ap .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ap .r1 b{min-width:0;overflow-wrap:anywhere}
.ap .r2{color:var(--mute);font-size:11px;margin-top:2px}
.ap code{user-select:all}
.note{margin:8px 0 0;padding:6px 8px;background:rgba(242,193,78,.08);border:1px dashed rgba(242,193,78,.5);color:var(--mute);font-size:11px;line-height:1.6}
.none{color:var(--dim);font-size:12px;padding:4px 2px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--dim);font-weight:400;text-align:left;font-size:11px;padding:0 4px 4px}
.tbl td{padding:4px;border-top:1px dashed rgba(255,255,255,.08);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl .ttl{overflow-wrap:anywhere}
.tbl .sub{display:block;color:var(--dim);font-size:10px}
.foot{margin:6px 0 0;color:var(--dim);font-size:11px;text-align:right}
@media (max-width:520px){.top{padding:8px 10px}.layout{padding:0 8px 24px}.kpi .v{font-size:16px}}
@media (prefers-reduced-motion:reduce){.badge,.ribbon,.badge.live::before{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>AI REVENUE CO.</span><small>AI 직원 오피스 · Pixel Office</small></div>
  <div class="spacer"></div>
  <label class="tog"><input type="checkbox" id="namesToggle"> 이름표 보기</label>
  <span class="meta" id="updated">연결 중…</span>

<noscript><p class="hint" style="display:block">이 대시보드는 JavaScript 가 필요합니다.</p></noscript>
<main class="layout">
  <section class="stage-wrap" aria-label="AI 오피스">
    <div class="stage-frame">
      <div class="stage-box" id="stageBox"><canvas id="stage" width="896" height="704" aria-label="픽셀 아트 오피스: 부서별 AI 직원 현황" role="img"></canvas></div>
      <div class="ribbon" id="ribbon" hidden>DEMO</div>
      <div class="tip" id="tip" hidden></div>

    <div class="legend" id="legend"></div>

  <aside class="panel" aria-label="경영 현황">
    <section class="card" id="cardKpi"><h2>경영 지표 <small>KPI</small></h2><div class="kpis" id="kpis"></div></section>
    <section class="card" id="cardAp"><h2>오너 승인 대기 <small>Approvals</small><span class="n" id="apCount"></span></h2><div id="approvals"></div></section>
    <section class="card" id="cardFeed"><h2>실시간 이벤트 <small>Live feed</small><span class="n" id="feedCount"></span></h2><ul class="list scroll" id="feed"></ul></section>
    <section class="card" id="cardProd"><h2>최근 상품 <small>Products</small><span class="n" id="prodCount"></span></h2><div class="scroll" id="products"></div></section>
  </aside>
</main>

<script>
'use strict';
/* =====================================================================
 * AI REVENUE CO. — 픽셀 오피스 대시보드 (단일 파일, 외부 이미지/스크립트 없음)
 *   1. CONSTANTS      상수·라벨·방 배치
 *   2. UTILS          해시/RNG/색/포맷
 *   3. DRAW HELPERS   픽셀 프리미티브, 5x7 비트맵 폰트, 베이크 캐시
 *   4. LAYOUT         좌석 생성/배정 (순수 함수)
 *   5. SCENE (static) 바닥·벽·방 장식 (오프스크린에 1회 렌더)
 *   6. FURNITURE      책상·테이블·모니터 (동적)
 *   7. SPRITES        캐릭터·말풍선
 *   8. ACTORS         상태→애니메이션/이동, 렌더 루프
 *   9. DATA           /api/state 폴링, 정규화, DEMO 시뮬레이터
 *  10. UI PANEL       KPI/이벤트/승인/상품, 툴팁
 *  11. BOOT
 * ===================================================================== */

/* ============================== 1. CONSTANTS ============================== */
const LW = 448, LH = 352;                 // 논리 해상도(px). 정수 배율로 확대한다.
const POLL_MS = 2000, PROBE_DEMO_MS = 6000;
const API_URL = '/api/state';
const DEMO_HINT = '실데이터 보려면: python scripts/office_server.py 실행 후 http://127.0.0.1:8765';

const ROLES = {

  pm:        { ko: '기획자',            short: '기획',   en: 'PM',         room: 'design',   color: '#5aa9e6', order: 2 },

};

};

const PRODUCT_STATUS = {
  draft:          { ko: '초안',      color: '#9aa7bd' },

  unknown:        { ko: '상태 없음', color: '#9aa7bd' },      // 서버가 status 가 빈 상품을 'unknown' 으로 센다
};
const APPROVAL_ACTIONS = {
  publish_listing: '상품 게시', price_change: '가격 변경', send_proposal: '제안서 발송', create_account: '계정 생성',
};

const FONT_STACK = '"Galmuri9","Galmuri11","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",monospace';
const FONT_EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const FONT_KO9 = '9px ' + FONT_STACK + ',' + FONT_EMOJI;
const FONT_EN7 = '7px "Galmuri7","Galmuri9",monospace';

/* 방(zone) 사각형 (논리 px). 벽/문틈은 5장에서 그린다. */
const ROOMS = {
  ceo:     { ko: '대표실',     en: 'CEO',       x: 154, y: 44,  w: 140, h: 164 },
  research:{ ko: '리서치',     en: 'Research',  x: 4,   y: 44,  w: 144, h: 80  },
  design:  { ko: '기획·디자인', en: 'Designing', x: 4,   y: 132, w: 144, h: 76  },
  market:  { ko: '마케팅',     en: 'Marketing', x: 300, y: 44,  w: 144, h: 80  },
  finance: { ko: '재무·법무',   en: 'Finance',   x: 300, y: 132, w: 144, h: 76  },

  testing: { ko: '검수',       en: 'Testing',   x: 300, y: 216, w: 144, h: 128 },
};
const ROOM_IDS = Object.keys(ROOMS);
const SIGNS = {   // 나무 표지판 위치(좌상단)
  ceo: [158, 48], research: [8, 50], design: [8, 134], market: [304, 50], finance: [304, 134], coding: [8, 218], testing: [304, 218],
};
/* 책상 격자: 좌석 x,y = 캐릭터 발 위치. 책상은 x-9 ~ x+19, 모니터는 오른쪽. show = 기본으로 보이는 책상 수 */

  research:{ x0: 24,  dx: 30, y0: 112, dy: 0,  cols: 3, rows: 1, show: 3 },
  design:  { x0: 24,  dx: 30, y0: 196, dy: 0,  cols: 3, rows: 1, show: 3 },
  market:  { x0: 316, dx: 30, y0: 112, dy: 0,  cols: 3, rows: 1, show: 3 },
  finance: { x0: 316, dx: 30, y0: 196, dy: 0,  cols: 2, rows: 1, show: 2 },
  coding:  { x0: 24,  dx: 30, y0: 280, dy: 42, cols: 8, rows: 2, show: 8 },
};
/* 둥근 회의 테이블. main=true 이면 그 방의 정규 좌석이 테이블 둘레(검수실) */
const TABLES = {
  ceo:     { cx: 224, cy: 184, rx: 20, ry: 9,  top: '#d9a56a', rim: '#9a6236' },
  research:{ cx: 126, cy: 102, rx: 12, ry: 6,  top: '#d9a56a', rim: '#9a6236' },
  design:  { cx: 124, cy: 192, rx: 14, ry: 7,  top: '#e8d7a8', rim: '#a98f55' },
  market:  { cx: 420, cy: 102, rx: 12, ry: 6,  top: '#d9a56a', rim: '#9a6236' },
  finance: { cx: 410, cy: 192, rx: 14, ry: 7,  top: '#cfd6e2', rim: '#7e889a' },
  coding:  { cx: 272, cy: 300, rx: 12, ry: 6,  top: '#d9a56a', rim: '#9a6236' },
  testing: { cx: 372, cy: 286, rx: 28, ry: 14, top: '#d4e8ee', rim: '#7da3b3', main: true },
};
const CEO_STAND = [[200, 128], [248, 128], [178, 146], [270, 146], [200, 168], [248, 168]];
const WINDOWS = [{ x: 112, y: 5, w: 22, h: 19 }, { x: 166, y: 5, w: 22, h: 19 }, { x: 260, y: 5, w: 22, h: 19 }, { x: 418, y: 5, w: 22, h: 19 }];

/* ============================== 2. UTILS ============================== */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function hash32(str) {                       // FNV-1a

function arr(v) { return Array.isArray(v) ? v : []; }
function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
/* 서버 응답(또는 데모)을 안전한 형태로 정규화. 어떤 입력이 와도 던지지 않는다. */
function normalizeState(raw) {
  const r = isObj(raw) ? raw : {};
  const seen = new Set(), agents = [];
  for (const a of arr(r.agents)) {
    if (!isObj(a)) continue;
    const id = str(a.id).trim();
    if (!id || seen.has(id)) continue;
    seen.add(id);
    agents.push({ id, role: str(a.role).trim() || prefixOf(id), state: normState(a.state), task: str(a.task), bubble: str(a.bubble), product_id: str(a.product_id), updated_at: str(a.updated_at) });
  }
  const events = arr(r.events).filter(isObj).map((e) => ({
    ts: str(e.ts), id: str(e.id), role: str(e.role).trim() || prefixOf(e.id), type: str(e.type).trim().toLowerCase() || 'note',
    state: str(e.state).trim().toLowerCase(), msg: str(e.msg), product_id: str(e.product_id),
  }));
  const products = arr(r.products).filter(isObj).map((p) => ({
    id: str(p.id), batch: str(p.batch), title: str(p.title), model: str(p.model), platform: str(p.platform),
    price_krw: num(p.price_krw), status: str(p.status).trim().toLowerCase(), created_at: str(p.created_at), listed_url: str(p.listed_url), notes: str(p.notes),
  }));
  const k = isObj(r.kpis) ? r.kpis : {}, by = isObj(k.by_status) ? k.by_status : {}, byStatus = {};
  Object.keys(by).forEach((s) => { byStatus[s] = Math.max(0, Math.round(num(by[s]))); });
  const has = (v) => v !== undefined && v !== null && v !== '';
  const kpis = {
    products_total: has(k.products_total) ? Math.max(0, Math.round(num(k.products_total))) : products.length,
    by_status: byStatus,
    revenue_krw_total: num(k.revenue_krw_total), revenue_krw_this_month: num(k.revenue_krw_this_month), expenses_krw_total: num(k.expenses_krw_total),
    net_krw_total: has(k.net_krw_total) ? num(k.net_krw_total) : num(k.revenue_krw_total) - num(k.expenses_krw_total),
  };
  const approvals = arr(r.approvals).filter(isObj).map((a) => ({
    id: str(a.id), product_id: str(a.product_id), action: str(a.action).trim(), requested_at: str(a.requested_at), status: str(a.status).trim().toLowerCase() || 'pending', note: str(a.note),
  }));
  return { now: str(r.now), agents, events, kpis, approvals, products };
}

  const st = own(STATES, ac.state) || STATES.idle, rk = ac.roleKey, role = rk ? ROLES[rk] : null, title = role ? role.ko : (clip(ac.role, 16) || '직원');
  return '<div class="tt-h"><span class="dot" style="--c:' + st.color + '"></span><b>' + esc(clip(ac.id, 40)) + '</b><span class="tt-role" style="--c:' + (role ? role.color : '#9aa7bd') + '">' + esc(title) + '</span></div>' +
    '<div class="tt-r"><span>상태</span><i style="color:' + st.color + '">' + esc(st.ko) + '</i></div>' +
    '<div class="tt-r"><span>작업</span><i>' + esc(clip(ac.task, 110) || '-') + '</i></div>' +
    (ac.product_id ? '<div class="tt-r"><span>상품</span><i><code>' + esc(clip(ac.product_id, 40)) + '</code></i></div>' : '') +
    '<div class="tt-r"><span>갱신</span><i>' + esc(relTime(ac.updated_at)) + '</i></div>';
}
function hideTip() { if (ui.el.tip) ui.el.tip.hidden = true; ui.tipPos = null; }
function placeTip(ac, px, py) {                    // px,py = 스테이지 프레임 기준 좌표 (스크롤/리플로에 안전)
  const tip = ui.el.tip, frame = ui.el.frame;
  if (!tip || !frame) return;
  ui.tipPos = [px, py, ac.id];
  tip.innerHTML = tipHTML(ac); tip.hidden = false;
  const fw = frame.clientWidth, fh = frame.clientHeight, tw = tip.offsetWidth || 200, th = tip.offsetHeight || 90;
  let x = px + 16, y = py + 16;
  if (x + tw > fw - 4) x = px - tw - 16;
  if (y + th > fh - 4) y = py - th - 12;
  tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
}
function showTip(ac, cx, cy) {
  const frame = ui.el.frame;
  if (!frame) return;
  const fr = frame.getBoundingClientRect();
  placeTip(ac, cx - fr.left, cy - fr.top);
}
function refreshTip() {
  if (!ui.tipPos) return;
  const ac = world.actors.get(ui.tipPos[2]);
  if (ac) placeTip(ac, ui.tipPos[0], ui.tipPos[1]); else hideTip();
}
function onPointer(e) {
  if (!canvas) return;
  const r = canvas.getBoundingClientRect();
  if (!r.width) return;
  const ac = hitTest(((e.clientX - r.left) * LW) / r.width, ((e.clientY - r.top) * LH) / r.height);
  world.hover = ac ? ac.id : null;
  canvas.classList.toggle('pointer', !!ac);
  if (e.type === 'pointerdown' && e.pointerType && e.pointerType !== 'mouse') world.pinned = ac ? ac.id : null;   // 터치: 탭하면 고정
  const target = ac || (world.pinned ? world.actors.get(world.pinned) : null);
  if (target) showTip(target, e.clientX, e.clientY); else hideTip();
}
function onLeave() { world.hover = null; if (!world.pinned) hideTip(); }

/* ---- 폴링 ---- */
let demo = null, errShown = false, liveFails = 0;
const LIVE_GRACE = 3;                                  // LIVE 중 연속 이 횟수만큼 실패해야 DEMO 로 전환 (일시적 끊김에 가짜 데이터로 갈아엎지 않는다)
function reportOnce(e) { if (!errShown) { errShown = true; if (typeof console !== 'undefined') console.error('[office]', e); } }
function applySnapshot(st, mode) {
  if (model.mode !== mode) { model.mode = mode; world.seatPrev = null; ui.feedSeen = null; setMode(mode); }
  model.state = st; model.at = Date.now();
  syncActors(st.agents);
  renderPanel(st);
  refreshTip();
}
async function fetchLive() {
  if (typeof location !== 'undefined' && location.protocol === 'file:') throw new Error('file://');
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, timer = ctl ? setTimeout(() => ctl.abort(), 4000) : 0;
  try {
    const res = await fetch(API_URL, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    if (!isObj(raw)) throw new Error('bad payload');
    return raw;
  } finally { if (timer) clearTimeout(timer); }
}
let lastProbe = 0;
async function pollOnce() {
  let raw = null;
  if (model.mode !== 'demo' || Date.now() - lastProbe >= PROBE_DEMO_MS) {   // DEMO 중에는 서버 재접속을 가끔만 시도 (콘솔 오류 소음 방지)
    lastProbe = Date.now();
    try { raw = await fetchLive(); } catch (e) { raw = null; }
  }
  try {
    if (raw) { liveFails = 0; applySnapshot(normalizeState(raw), 'live'); }
    else if (model.mode === 'live' && ++liveFails < LIVE_GRACE) {
      if (ui.el.updated) ui.el.updated.textContent = '⚠ 연결 끊김 · 재시도 중 (' + liveFails + '/' + (LIVE_GRACE - 1) + ')';   // 마지막 실데이터 유지
    } else { liveFails = 0; if (!demo) demo = makeDemo(); applySnapshot(normalizeState(demo.step(Date.now())), 'demo'); }
  } catch (e) { reportOnce(e); }
}
function pollLoop() { pollOnce().then(() => setTimeout(pollLoop, POLL_MS), () => setTimeout(pollLoop, POLL_MS)); }

/* ============================== 11. BOOT ============================== */
function fitCanvas() {
  const box = ui.el.stageBox;
  if (!canvas || !box) return;
  const avail = Math.floor(box.clientWidth), dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  if (!avail) return;
  let s = Math.max(1, Math.floor((avail * dpr) / LW)), cssW = (s * LW) / dpr;
  if (cssW < avail * 0.85 || cssW > avail) { s = Math.max(1, Math.ceil((avail * dpr) / LW)); cssW = avail; }   // 좁은 화면/넘칠 때: 폭에 맞춤(비정수 배율). 가로세로 비율은 항상 유지
  s = clamp(s, 1, 6);
  canvas.style.width = cssW + 'px'; canvas.style.height = (cssW * LH) / LW + 'px';
  canvas.style.imageRendering = cssW * dpr >= LW * s - 0.5 ? 'pixelated' : 'auto';
  if (s !== S || canvas.width !== LW * s) { S = s; canvas.width = LW * S; canvas.height = LH * S; bakeCache.clear(); bgDirty = true; }
}
function loadFonts() {
  if (typeof document === 'undefined' || !document.fonts || !document.fonts.load) return;
  Promise.all(['9px Galmuri9', '7px Galmuri7', '11px Galmuri11'].map((f) => document.fonts.load(f, '가나다 AaBb 0123').catch(() => null)))
    .then(() => { bakeCache.clear(); bgDirty = true; }).catch(() => {});
}
let lastT = 0, frameNo = 0, lastBoxW = 0;
function frame(ms) {
  const t = ms / 1000, dt = clamp(t - lastT, 0, 0.25);
  lastT = t;
  if ((frameNo++ & 15) === 0 && ui.el.stageBox && ui.el.stageBox.clientWidth !== lastBoxW) { lastBoxW = ui.el.stageBox.clientWidth; fitCanvas(); }   // ResizeObserver 보조
  try { world.actors.forEach((ac) => updateActor(ac, dt)); render(t); } catch (e) { reportOnce(e); }
  requestAnimationFrame(frame);
}
function boot() {
  const $ = (id) => document.getElementById(id);
  ['stage', 'stageBox', 'tip', 'modeBadge', 'demoHint', 'ribbon', 'updated', 'legend', 'kpis', 'approvals', 'feed', 'products', 'apCount', 'feedCount', 'prodCount', 'namesToggle']
    .forEach((id) => { ui.el[id] = $(id); });
  ui.el.frame = ui.el.stageBox ? ui.el.stageBox.parentNode : null;
  canvas = ui.el.stage; ctx = canvas.getContext('2d');
  fitCanvas();
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitCanvas).observe(ui.el.stageBox); else window.addEventListener('resize', fitCanvas);
  window.addEventListener('galmuri', loadFonts); loadFonts();
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { bakeCache.clear(); bgDirty = true; });
  ['pointermove', 'pointerdown'].forEach((n) => canvas.addEventListener(n, onPointer));
  canvas.addEventListener('pointerleave', onLeave);
  const tgl = ui.el.namesToggle;
  if (tgl) {
    try { tgl.checked = localStorage.getItem('office.names') === '1'; } catch (e) { /* 저장소 사용 불가 */ }
    world.showNames = !!tgl.checked;
    tgl.addEventListener('change', () => { world.showNames = tgl.checked; try { localStorage.setItem('office.names', tgl.checked ? '1' : '0'); } catch (e) { /* ignore */ } });
  }
  pollLoop();
  requestAnimationFrame(frame);
}

/* 테스트용 노출 (브라우저에서는 window.__OFFICE__) */
const OFFICE_API = {
  LW, LH, ROLES, STATES, ROOMS, DESKS, TABLES, hash32, mulberry32, paletteFor, fmtKRW, fmtNum, relTime, hhmm, esc, prefixOf, roleKeyOf, roomOf, normState, cmpAgent,
  seatFor, meetSeat, tableSeatPos, allocateSeats, deskCap, normalizeState, makeDemo, mixHex, bubbleOf, world, model, ui, syncActors, updateActor, render, applySnapshot, pollOnce,
  fitCanvas, hitTest, buildDrawables, drawScene, boot, getS: () => S,
};
if (typeof window !== 'undefined') window.__OFFICE__ = OFFICE_API;
if (typeof document !== 'undefined' && document.getElementById && document.getElementById('stage')) boot();
</script>
